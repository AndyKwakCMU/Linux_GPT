[project]
name = "linuxgpt"
version = "0.1.0"
description = "Citation-verified RAG Q&A over Linux kernel source (F2FS + neighboring subsystems)"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4",
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
    "lancedb>=0.17",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
linuxgpt = "linuxgpt.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
